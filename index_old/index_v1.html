<style>
:root{--g:#b8860b;--bg:#faf7ef;--ok:#1b7f3b;--warn:#c0392b;--card:#fff;--line:#e5dfcf}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;background:var(--bg);color:#222;font-size:17px}
header{background:var(--g);color:#fff;padding:12px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:18px}label{display:block;font-size:14px;color:#555;margin-top:8px}
input,select{width:100%;padding:12px;font-size:18px;border:1px solid #bbb;border-radius:8px;background:#fff}
.row{display:flex;gap:10px}.row>*{flex:1}
button{padding:12px 14px;font-size:17px;border:0;border-radius:10px;background:var(--g);color:#fff;font-weight:600;width:100%;margin-top:8px}
button.sec{background:#eee;color:#333}button.red{background:var(--warn)}
.big{font-size:20px;font-weight:700}.ok{color:var(--ok)}.bad{color:var(--warn)}
.act{border-left:6px solid var(--g);padding:10px;background:#fff8e1;border-radius:8px;margin:8px 0}
.act.sell{border-color:var(--ok);background:#e8f6ec}.act.buy{border-color:#1f6fb2;background:#e8f1fa}.act.ath{border-color:var(--warn);background:#fdecea}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
.small{font-size:13px;color:#666}.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:13px;color:#fff}
dialog{border:0;border-radius:14px;padding:16px;width:min(92vw,440px)}dialog::backdrop{background:#0006}
details summary{font-weight:700;cursor:pointer;padding:4px 0}
.srow{border-bottom:1px solid var(--line);padding:6px 0}

<main>
<div class="card"><h2>1) ใส่ราคาวันนี้</h2>

<div class="small" id="nexts"></div></div>

<div class="card"><h2>ประวัติการขาย</h2><div id="hist"></div></div>

<div class="card"><details><summary>ตั้งค่า (ส่วนใหญ่ไม่ต้องแตะ)</summary>
<div class="row"><div><label>ราคาอ้างอิงสูงสุด (ATH)</label><input id="p_ath" type="number"></div><div><label>ส่วนต่าง Ask−Bid (เติมอัตโนมัติ)</label><input id="p_spr" type="number"></div></div>
<div class="row"><div><label>โซน L2 เริ่มที่ลง (%)</label><input id="p_l2" type="number" step="any"></div><div><label>โซน L2 สิ้นสุดที่ลง (%)</label><input id="p_l2e" type="number" step="any"></div></div>
<div class="row"><div><label>ทุน Layer 1</label><input id="p_c1" type="number"></div><div><label>ทุน Layer 2</label><input id="p_c2" type="number"></div></div>
<div class="row"><div><label>จำนวนไม้ L1</label><input id="p_s1" type="number"></div><div><label>จำนวนไม้ L2</label><input id="p_s2" type="number"></div></div>
<div class="row"><div><label>เป้ากำไร L1 (%)</label><input id="p_t1" type="number" step="any"></div><div><label>เป้ากำไร L2 (%)</label><input id="p_t2" type="number" step="any"></div></div>
<div class="row"><div><label>ซื้อขั้นต่ำ (บาททอง)</label><input id="p_min" type="number" step="any"></div><div></div></div>
<div class="small" id="gridInfo"></div>
<button id="saveP">บันทึกการตั้งค่า</button></details></div>

<div class="card"><h2>สำรองข้อมูล และแจ้งเตือน</h2>
<button class="sec" id="exp">ส่งออกไฟล์สำรอง (JSON)</button>
<button class="sec" id="expCsv">ส่งออกตาราง (CSV)</button>
<button class="sec" id="imp">นำเข้าไฟล์สำรอง</button><input id="impFile" type="file" accept=".json" hidden>
<button class="sec" id="notif">เปิดแจ้งเตือนเมื่อเปิดแอป</button>
<div class="small">แจ้งเตือนทำงานเมื่อแอปเปิดอยู่ ยังไม่เตือนตอนปิดแอป ควรส่งออกไฟล์สำรองสัปดาห์ละครั้ง</div>
<button class="red" id="reset">ล้างข้อมูลทั้งหมด</button></div>
</main>

<dialog id="dlgBuy"><h2>บันทึกการซื้อ</h2>
<label>วันที่</label><input id="b_date" type="date">
<label>Layer</label><select id="b_layer"><option value="1">1</option><option value="2">2</option></select>
<label>จำนวนไม้ที่ซื้อ (ขนาดเท่ากัน)</label><input id="b_count" type="number" min="1" step="1" inputmode="numeric">
<label>จำนวนบาททองต่อไม้</label><input id="b_gold" type="number" step="any" inputmode="decimal">
<label>เงินรวมที่แอปหักจริงต่อไม้ (บาท)</label><input id="b_money" type="number" step="any" inputmode="decimal">
<div class="small" id="b_hint"></div>
<button id="b_save">บันทึก</button><button class="sec" id="b_cancel">ยกเลิก</button></dialog>

<dialog id="dlgSell"><h2>บันทึกการขาย</h2>
<label>วันที่ขาย</label><input id="s_date" type="date">
<div id="s_rows"></div>
<div class="small" id="s_hint"></div>
<button id="s_save">บันทึก</button><button class="sec" id="s_cancel">ยกเลิก</button></dialog>

<script id="logic">

const DEFAULTS = {ath:80000, l2start:0.30, l2end:0.50, minGold:0.01, spread:200,
  L1:{cap:100000, slots:15, tp:0.02}, L2:{cap:100000, slots:6, tp:0.03}};
const r6 = x => Math.round(x*1e6)/1e6;
const fix2 = x => Math.round(x*100)/100;
const floorGold = (x, step) => Math.floor(x/step + 1e-9) * step;
function grids(p){ return {g1: p.l2start/p.L1.slots, g2: (p.l2end - p.l2start)/p.L2.slots}; }
function layerInfo(state, n){
  const L = state.params['L'+n];
  const mine = state.lots.filter(l => l.layer === n);
  const open = mine.filter(l => l.status === 'OPEN');
  const realized = mine.filter(l => l.status === 'CLOSED').reduce((s,l)=> s + (l.K - l.D), 0);
  const invested = open.reduce((s,l)=> s + l.D, 0);
  return {n, L, open, held: open.length, realized, cap: L.cap + realized, invested, slots: L.slots};
}
function analyze(state, bid, ask){
  const p = state.params, G = grids(p);
  const dd = 1 - bid/p.ath;
  const out = {dd, layers:{}, sells:[], buys:[], issues:[]};
  for (const n of [1,2]){
    const li = layerInfo(state, n);
    const g = n === 1 ? G.g1 : G.g2;
    let level = 0;
    if (n === 1) level = Math.min(Math.floor(r6(dd/g)), li.slots);
    else if (dd >= p.l2start) level = Math.min(Math.floor(r6((dd - p.l2start)/g)), li.slots);
    level = Math.max(0, level);
    const need = Math.max(0, Math.min(level - li.held, li.slots - li.held));
    const size = li.slots > li.held ? (li.cap - li.invested)/(li.slots - li.held) : 0;
    const gold = ask > 0 ? fix2(floorGold(Math.max(0,size)/ask, p.minGold)) : 0;
    const nextBuy = li.held >= li.slots ? null :
      Math.round(n === 1 ? p.ath*(1 - (li.held+1)*g) : p.ath*(1 - p.l2start - (li.held+1)*g));
    out.layers[n] = {...li, level, need, size, gold, nextBuy};
    if (need > 0) out.buys.push({layer:n, count:need, gold, money: fix2(gold*ask), short: gold < p.minGold});
    if (li.held > li.slots) out.issues.push('Layer '+n+': ไม้ที่ถืออยู่เกินจำนวนช่อง');
  }
  const opens = state.lots.filter(l => l.status === 'OPEN');
  opens.forEach(l => {
    const tp = l.D / l.O * (1 + p['L'+l.layer].tp);
    l.tpPrice = Math.round(tp*100)/100;
    if (bid >= tp - 1e-9) out.sells.push({lot:l, profit: fix2(l.O*bid - l.D), money: fix2(l.O*bid)});
  });
  out.nextTP = opens.length ? Math.min(...opens.map(l => l.D/l.O*(1 + p['L'+l.layer].tp))) : null;
  const closed = state.lots.filter(l => l.status === 'CLOSED');
  const realized = closed.reduce((s,l)=> s + (l.K - l.D), 0);
  const unreal = opens.reduce((s,l)=> s + (l.O*bid - l.D), 0);
  const invested = opens.reduce((s,l)=> s + l.D, 0);
  const goldValue = opens.reduce((s,l)=> s + l.O*bid, 0);
  const wins = closed.filter(l => l.K - l.D > 0).length;
  const days = closed.map(l => (new Date(l.sellDate) - new Date(l.date))/86400000);
  out.stats = {realized:fix2(realized), unreal:fix2(unreal), total:fix2(realized+unreal),
    equity: fix2(p.L1.cap + p.L2.cap + realized - invested + goldValue), start: p.L1.cap + p.L2.cap,
    sold: closed.length, held: opens.length, winRate: closed.length ? wins/closed.length : null,
    avgProfit: closed.length ? fix2(realized/closed.length) : null,
    avgDays: closed.length ? days.reduce((a,b)=>a+b,0)/closed.length : null};
  return out;
}
function sanePricePerBaht(p, money, gold){
  if (!(gold > 0) || !(money > 0)) return false;
  const r = money/gold; return r >= p.ath*0.3 && r <= p.ath*1.05;
}

</script>
<script>
const KEY='goldlot2l.v2';
const $=id=>document.getElementById(id);
const fmt=(x,d=2)=>x==null||isNaN(x)?'-':Number(x).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt0=x=>fmt(x,0);
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const dshow=s=>{if(!s)return '-';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
let S=load();
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.params)return j}catch(e){}
  return {params:JSON.parse(JSON.stringify(DEFAULTS)),lots:[],nextId:1,bid:'',ask:'',askTouched:false,athDismissed:null}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
let A=null,pendingSell=[];

function render(){
  const bid=parseFloat($('bid').value),ask=parseFloat($('ask').value),p=S.params;
  const ok=bid>0&&ask>0;
  $('priceHint').textContent=!ok?'':ask<bid?'⚠ ราคาขายออกต่ำกว่าราคารับซื้อ ตรวจว่าไม่ได้สลับช่อง':
    bid<p.ath*0.4?'⚠ ราคาต่ำกว่า 40% ของ ATH มาก ตรวจว่าพิมพ์ครบทุกหลัก':
    bid>p.ath*1.2?'⚠ ราคาสูงกว่า ATH เกิน 20% ตรวจว่าพิมพ์เกินหลักหรือเปล่า':'';
  renderAth(bid);
  if(!ok){$('today').innerHTML='<div class="small">ใส่ราคารับซื้อและราคาขายออกก่อน</div>';
    $('status').innerHTML='';$('nexts').textContent='';A=null;drawLots();drawStats();return}
  A=analyze(S,bid,ask);
  let h='';
  if(A.sells.length){
    const tm=A.sells.reduce((s,x)=>s+x.money,0),tpf=A.sells.reduce((s,x)=>s+x.profit,0);
    h+=`<div class="act sell"><div class="big">ขาย ${A.sells.length} ไม้</div>`+
      A.sells.map(s=>`<div class="srow">ไม้ ${s.lot.id} (L${s.lot.layer}) ${fmt(s.lot.O,2)} บาททอง เป้า ${fmt0(s.lot.tpPrice)} กำไร ${fmt0(s.profit)}</div>`).join('')+
      `<div>คาดว่าได้เงินรวม ${fmt0(tm)} บาท กำไรรวม ${fmt0(tpf)} บาท</div>
      <button id="sellAll">ขายเสร็จแล้ว บันทึก</button></div>`}
  A.buys.forEach(b=>{h+=`<div class="act buy"><div class="big">ซื้อ: Layer ${b.layer} จำนวน ${b.count} ไม้ x ${fmt(b.gold,2)} บาททอง</div>
    ${b.short?'<span class="bad">ทุนต่อไม้น้อยกว่าขั้นต่ำของแอป ลดจำนวนไม้หรือเพิ่มทุน</span>':
    `คาดว่าจ่ายไม้ละ ${fmt0(b.money)} บาท รวม ${fmt0(b.money*b.count)} บาท (ที่ราคาขายออก ${fmt0(ask)})
    <button data-buy="${b.layer}" data-count="${b.count}" data-gold="${b.gold}">ซื้อเสร็จแล้ว บันทึก</button>`}</div>`});
  if(!h)h='<div class="act"><div class="big">ไม่ต้องทำอะไร</div>ปิดแอปได้เลย</div>';
  $('today').innerHTML=h;
  $('status').innerHTML=A.issues.length?`<span class="pill" style="background:var(--warn)">ตรวจ</span> ${A.issues.join('<br>')}`:
    `<span class="pill" style="background:var(--ok)">ปกติ</span> ราคาลงจาก ATH ${fmt(A.dd*100)}%`;
  const l1=A.layers[1],l2=A.layers[2];
  $('nexts').innerHTML=`ซื้อ L1 ไม้ถัดไปที่ราคารับซื้อ ${l1.nextBuy==null?'เต็ม':fmt0(l1.nextBuy)}<br>
   ซื้อ L2 ไม้ถัดไปที่ราคารับซื้อ ${l2.nextBuy==null?'เต็ม':fmt0(l2.nextBuy)}<br>
   ไม้ถัดไปที่จะถึงเป้าขายที่ ${A.nextTP==null?'-':fmt0(A.nextTP)}`;
  drawLots();drawStats();
  const sa=$('sellAll');if(sa)sa.onclick=()=>openSell(A.sells.map(s=>s.lot.id));
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>openBuy(+b.dataset.buy,+b.dataset.count,+b.dataset.gold));
  maybeNotify();
}
function renderAth(bid){
  const c=$('athCard');
  if(bid>S.params.ath&&S.athDismissed!==bid){
    c.innerHTML=`<div class="card"><div class="act ath"><div class="big">ราคาทำ ATH ใหม่?</div>
    ราคารับซื้อ ${fmt0(bid)} สูงกว่า ATH เดิม ${fmt0(S.params.ath)}<br>ถ้าเปลี่ยน ATH ระบบจะคำนวณโซนใหม่จาก ${fmt0(bid)} และ L2 จะหยุดรอ
    <button id="athYes">ยืนยัน เปลี่ยน ATH เป็น ${fmt0(bid)}</button>
    <button class="sec" id="athNo">ไม่เปลี่ยน</button></div></div>`;
    $('athYes').onclick=()=>{S.params.ath=bid;S.athDismissed=null;save();fillParams();render()};
    $('athNo').onclick=()=>{S.athDismissed=bid;save();render()};
  }else c.innerHTML='';
}
function drawLots(){
  const bid=parseFloat($('bid').value)||0;
  const open=S.lots.filter(l=>l.status==='OPEN');
  if(!open.length){$('lots').innerHTML='<div class="small">ยังไม่มีไม้ที่ถืออยู่</div>';return}
  let h='<table><tr><th>ไม้</th><th>L</th><th>วันที่</th><th>ทอง</th><th>ซื้อที่</th><th>เป้าขาย</th><th>กำไรตอนนี้</th></tr>';
  open.forEach(l=>{const bp=l.D/l.O,tp=bp*(1+S.params['L'+l.layer].tp);const pl=bid?l.O*bid-l.D:null;
    h+=`<tr><td>${l.id}</td><td>${l.layer}</td><td>${dshow(l.date)}</td><td>${fmt(l.O,2)}</td><td>${fmt0(bp)}</td><td>${fmt0(tp)}</td>
    <td class="${pl>=0?'ok':'bad'}">${pl==null?'-':fmt0(pl)}</td></tr>`});
  $('lots').innerHTML=h+'</table>';
}
function drawStats(){
  const bid=parseFloat($('bid').value)||S.params.ath, ask=parseFloat($('ask').value)||bid;
  const a=A||analyze(S,bid,ask),s=a.stats;
  $('stats').innerHTML=`<table>
  <tr><td>กำไรที่ขายแล้ว</td><td class="${s.realized>=0?'ok':'bad'}">${fmt(s.realized)}</td></tr>
  <tr><td>กำไร/ขาดทุนที่ยังถืออยู่</td><td class="${s.unreal>=0?'ok':'bad'}">${fmt(s.unreal)}</td></tr>
  <tr><td>รวมทั้งหมด</td><td class="${s.total>=0?'ok':'bad'}"><b>${fmt(s.total)}</b></td></tr>
  <tr><td>มูลค่าพอร์ตโดยประมาณ</td><td>${fmt(s.equity)} (เริ่ม ${fmt0(s.start)})</td></tr>
  <tr><td>ไม้ที่ขายแล้ว / ถืออยู่</td><td>${s.sold} / ${s.held}</td></tr>
  <tr><td>อัตราชนะ</td><td>${s.winRate==null?'-':fmt(s.winRate*100,0)+'%'}</td></tr>
  <tr><td>กำไรเฉลี่ยต่อไม้ที่ขาย</td><td>${fmt(s.avgProfit)}</td></tr>
  <tr><td>วันถือเฉลี่ย</td><td>${s.avgDays==null?'-':fmt(s.avgDays,1)}</td></tr></table>
  <div class="small">มูลค่าพอร์ตคิดที่ราคารับซื้อ ไม่รวมค่าธรรมเนียมอื่นของแอป</div>`;
  const cl=S.lots.filter(l=>l.status==='CLOSED').slice().reverse();
  $('hist').innerHTML=cl.length?'<table><tr><th>ไม้</th><th>L</th><th>ขายวันที่</th><th>กำไร</th></tr>'+cl.map(l=>
   `<tr><td>${l.id}</td><td>${l.layer}</td><td>${dshow(l.sellDate)}</td><td class="${l.K-l.D>=0?'ok':'bad'}">${fmt(l.K-l.D)}</td></tr>`).join('')+'</table>':'<div class="small">ยังไม่มี</div>';
}
function bTotal(){const n=parseInt($('b_count').value)||0,m=parseFloat($('b_money').value)||0;
  $('b_hint').textContent='รวมทั้งหมด '+fmt0(n*m)+' บาท (แก้เป็นตัวเลขจริงจากแอป ถ้าไม่ตรง)'}
['b_count','b_money'].forEach(i=>$(i).addEventListener('input',bTotal));
function openBuy(layer,count,gold){
  const ask=parseFloat($('ask').value);
  $('b_date').value=today();$('b_layer').value=layer;$('b_count').value=count;$('b_gold').value=gold;$('b_money').value=fix2(gold*ask);
  bTotal();$('dlgBuy').showModal();
}
$('b_cancel').onclick=()=>$('dlgBuy').close();
$('b_save').onclick=()=>{
  const O=parseFloat($('b_gold').value),D=parseFloat($('b_money').value),n=parseInt($('b_count').value)||0;
  if(n<1){alert('จำนวนไม้ต้องอย่างน้อย 1');return}
  if(!sanePricePerBaht(S.params,D,O)){
    if(!confirm('เงินรวมหารจำนวนทองได้ '+fmt0(D/O)+' บาท/บาททอง ซึ่งผิดปกติ\nช่องเงินรวมต้องเป็นยอดที่จ่ายต่อไม้ ไม่ใช่ราคาต่อบาททอง\nบันทึกต่อไหม?'))return}
  for(let i=0;i<n;i++)S.lots.push({id:S.nextId++,date:$('b_date').value,D,O,layer:+$('b_layer').value,status:'OPEN'});
  save();$('dlgBuy').close();render();
};
function openSell(ids){
  const bid=parseFloat($('bid').value);
  pendingSell=S.lots.filter(l=>ids.includes(l.id));
  $('s_date').value=today();
  $('s_rows').innerHTML=pendingSell.map(l=>`<div class="srow"><div class="small">ไม้ ${l.id} (L${l.layer}) ${fmt(l.O,2)} บาททอง ต้นทุน ${fmt0(l.D)}</div>
    <input type="number" step="any" inputmode="decimal" data-k="${l.id}" value="${fix2(l.O*bid)}"></div>`).join('');
  $('s_hint').textContent='ช่องคือเงินที่เข้าบัญชีจริงของแต่ละไม้ แก้ให้ตรงกับแอป';
  $('dlgSell').showModal();
}
$('s_cancel').onclick=()=>$('dlgSell').close();
$('s_save').onclick=()=>{
  const d=$('s_date').value,vals={};
  for(const l of pendingSell){
    const K=parseFloat(document.querySelector('[data-k="'+l.id+'"]').value);vals[l.id]=K;
    if(d<l.date){alert('วันที่ขายต้องไม่มาก่อนวันที่ซื้อ (ไม้ '+l.id+')');return}
  }
  const bad=pendingSell.filter(l=>!sanePricePerBaht(S.params,vals[l.id],l.O));
  if(bad.length&&!confirm('ไม้ '+bad.map(l=>l.id).join(', ')+' มีเงินหารจำนวนทองผิดปกติ ใช่ยอดรวมที่ได้จริงหรือไม่ บันทึกต่อไหม?'))return;
  pendingSell.forEach(l=>{l.status='CLOSED';l.sellDate=d;l.K=vals[l.id]});
  save();$('dlgSell').close();render();
};
function fillParams(){const p=S.params;
  $('p_ath').value=p.ath;$('p_spr').value=p.spread;$('p_l2').value=p.l2start*100;$('p_l2e').value=p.l2end*100;
  $('p_c1').value=p.L1.cap;$('p_c2').value=p.L2.cap;$('p_s1').value=p.L1.slots;$('p_s2').value=p.L2.slots;
  $('p_t1').value=p.L1.tp*100;$('p_t2').value=p.L2.tp*100;$('p_min').value=p.minGold;
  const g=grids(p);$('gridInfo').textContent='ระยะห่างไม้ที่คำนวณได้: L1 '+fmt(g.g1*100)+'% / L2 '+fmt(g.g2*100)+'%'}
$('saveP').onclick=()=>{const p=S.params;
  p.ath=+$('p_ath').value;p.spread=+$('p_spr').value;p.l2start=+$('p_l2').value/100;p.l2end=+$('p_l2e').value/100;
  p.L1.cap=+$('p_c1').value;p.L2.cap=+$('p_c2').value;p.L1.slots=+$('p_s1').value;p.L2.slots=+$('p_s2').value;
  p.L1.tp=+$('p_t1').value/100;p.L2.tp=+$('p_t2').value/100;p.minGold=+$('p_min').value;
  save();fillParams();render();alert('บันทึกแล้ว')};
$('bid').addEventListener('input',()=>{const b=parseFloat($('bid').value);
  if(b>0&&!S.askTouched)$('ask').value=b+S.params.spread;S.bid=$('bid').value;S.ask=$('ask').value;save();render()});
$('ask').addEventListener('input',()=>{S.askTouched=true;S.ask=$('ask').value;save();render()});
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
$('exp').onclick=()=>dl('goldlot-backup-'+today()+'.json',JSON.stringify(S),'application/json');
$('expCsv').onclick=()=>{const rows=[['id','date','layer','gold','money_paid','status','sell_date','money_received','profit']];
  S.lots.forEach(l=>rows.push([l.id,l.date,l.layer,l.O,l.D,l.status,l.sellDate||'',l.K||'',l.status==='CLOSED'?l.K-l.D:'']));
  dl('goldlot-'+today()+'.csv',rows.map(r=>r.join(',')).join('\n'),'text/csv')};
$('imp').onclick=()=>$('impFile').click();
$('impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.params||!j.lots||!j.params.L1)throw 0;if(confirm('แทนที่ข้อมูลปัจจุบันด้วยไฟล์สำรอง?')){S=j;save();init()}}catch(x){alert('ไฟล์ไม่ถูกต้อง')}};r.readAsText(f)};
$('reset').onclick=()=>{if(confirm('ล้างข้อมูลทั้งหมด? แนะนำให้ส่งออกไฟล์สำรองก่อน')&&confirm('ยืนยันอีกครั้ง')){localStorage.removeItem(KEY);S=load();init()}};
let lastKey='';
function maybeNotify(){if(!A||!('Notification' in window)||Notification.permission!=='granted')return;
  const msg=[];if(A.sells.length)msg.push('ขาย '+A.sells.length+' ไม้');A.buys.forEach(b=>msg.push('ซื้อ L'+b.layer+' '+b.count+' ไม้'));
  const k=msg.join('|');if(!k||k===lastKey)return;lastKey=k;
  if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification('GoldLot2L',{body:msg.join(', ')}));else new Notification('GoldLot2L',{body:msg.join(', ')})}
$('notif').onclick=async()=>{if(!('Notification' in window))return alert('เบราว์เซอร์นี้ไม่รองรับ');
  const r=await Notification.requestPermission();alert(r==='granted'?'เปิดแล้ว':'ไม่ได้รับอนุญาต')};
function net(){$('net').textContent=navigator.onLine?'ออนไลน์':'ออฟไลน์'}
addEventListener('online',net);addEventListener('offline',net);
function init(){fillParams();$('bid').value=S.bid||'';$('ask').value=S.ask||'';net();render()}
init();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
</script></body></html>
